[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "flagtree-debugger"
version = "0.1.0"
description = "Optional debugger component for FlagTree"
requires-python = ">=3.10"
dependencies = ["flagtree>=0.6,<0.7"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["flagtree_debugger*"]

[tool.setuptools.package-data]
flagtree_debugger = ["_native*.so", "_native*.pyd"]
