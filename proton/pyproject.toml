[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "flagtree-profiler"
version = "0.1.0"
description = "Optional Proton profiler component for FlagTree"
requires-python = ">=3.10"
dependencies = ["flagtree>=0.6,<0.7"]

[project.scripts]
proton = "flagtree_profiler.proton:main"
proton-viewer = "flagtree_profiler.viewer:main"

[tool.setuptools]
packages = ["flagtree_profiler", "flagtree_profiler.hooks"]
package-dir = {flagtree_profiler = "proton", "flagtree_profiler.hooks" = "proton/hooks"}

[tool.setuptools.package-data]
flagtree_profiler = ["libproton*.so", "libproton*.pyd"]
